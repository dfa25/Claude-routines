name: Backfill Weekly Login Rollups (one-off)

# One-off recovery of contacts dropped between 2026-05-15 and 2026-05-31.
# Already executed successfully on 2026-06-01 (63 rows recovered into the two
# Notion DBs, exit 0, 0 upsert failures).
#
# Kept dispatch-only for the record / future re-runs. To re-run: pick a mode
# ('dry' to preview, 'write' to apply). The script is idempotent on
# Email + Week of, so re-running never duplicates rows.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: 'dry' (preview only) or 'write' (apply Notion writes)"
        required: false
        default: 'dry'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private data store
        uses: actions/checkout@v4
        with:
          repository: dfa25/avid-routines-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run weekly backfill
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.mode == 'write' && '0' || '1' }}
          SNAPSHOT_DIR: ${{ github.workspace }}/_data/snapshots
          OVERRIDES_PATH: ${{ github.workspace }}/_data/classification_overrides.json
        run: python scripts/backfill_weekly_from_snapshots.py
