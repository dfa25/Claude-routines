name: Backfill Weekly Login Rollups (one-off)

# One-off recovery of contacts dropped between 2026-05-15 and 2026-05-31.
# Already executed successfully on 2026-06-01 (see data/backfill-result.txt:
# 63 rows recovered into the two Notion DBs, exit 0, 0 upsert failures).
#
# Kept dispatch-only for the record / future re-runs. To re-run: pick a mode
# ('dry' to preview, 'write' to apply). The script is idempotent on
# Email + Week of, so re-running never duplicates rows.
#
# (The earlier push-on-sentinel trigger was a one-off workaround to drive the
# run when the Actions UI wouldn't surface the dispatch button; removed here so
# nothing writes to Notion automatically on a file push.)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: 'dry' (preview only) or 'write' (apply Notion writes)"
        required: false
        default: 'dry'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run weekly backfill
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.mode == 'write' && '0' || '1' }}
        run: python scripts/backfill_weekly_from_snapshots.py
