name: Backfill Weekly Login Rollups (one-off)

# Bare workflow_dispatch with no inputs to force GitHub to surface the
# Run button. Writes recovered rows into Notion (DRY_RUN=0 hard-coded).
# The reconciliation logic in the script is identical to the dry run
# we already verified locally — see commit 92d859b.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run weekly backfill (WRITE mode)
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: '0'
        run: python scripts/backfill_weekly_from_snapshots.py
