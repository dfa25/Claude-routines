name: Weekly Login Report — UK

on:
  schedule:
    # Mon 9am AEST = Sun 23:00 UTC. Drifts to Mon 10am during AEDT (Oct–Apr).
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private data store
        uses: actions/checkout@v4
        with:
          repository: dfa25/Claude-routines-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run weekly login report (UK)
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REGION: UK
          SNAPSHOT_DIR: ${{ github.workspace }}/_data/snapshots
        run: python scripts/weekly_login_report.py
