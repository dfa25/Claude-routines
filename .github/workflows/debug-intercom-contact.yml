name: Debug — Intercom contact lookup

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email to look up in Intercom'
        required: true
        default: '***REMOVED***'
      expected_session_count:
        description: 'Session count to hunt for in the JSON response (from the Intercom UI)'
        required: false
        default: '48'
  push:
    paths:
      - 'data/.debug-trigger'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inspect Intercom contact
        env:
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          # On manual dispatch use the input; on push read the email from the
          # first line of the sentinel file so the lookup can be driven by a commit.
          DISPATCH_EMAIL: ${{ github.event.inputs.email }}
          EXPECTED_SESSION_COUNT: ${{ github.event.inputs.expected_session_count }}
        run: |
          if [ -n "${DISPATCH_EMAIL}" ]; then
            export DEBUG_EMAIL="${DISPATCH_EMAIL}"
          else
            export DEBUG_EMAIL="$(head -n1 data/.debug-trigger | tr -d '[:space:]')"
          fi
          echo "Looking up: ${DEBUG_EMAIL}"
          python scripts/debug_intercom_contact.py
