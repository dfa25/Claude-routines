name: Debug — Agency company audit

# Read-only audit of agency company records across all type=Advertiser domains.
# Manual dispatch only. Results in the job logs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private data store
        uses: actions/checkout@v4
        with:
          repository: dfa25/Claude-routines-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: _data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run agency audit
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          OVERRIDES_PATH: ${{ github.workspace }}/_data/classification_overrides.json
        run: python scripts/audit_agency_companies.py
