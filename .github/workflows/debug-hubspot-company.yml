name: Debug — HubSpot company lookup

# Fires on push to data/.debug-hubspot-trigger. First line of the sentinel is
# the company-name search term (CONTAINS_TOKEN); optional second line is an
# email domain to query exactly. Reads HubSpot via the existing
# HUBSPOT_ACCESS_TOKEN secret; results in the job logs.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Company name to search (CONTAINS_TOKEN)'
        required: true
        default: 'zenith'
      domain:
        description: 'Optional: exact email domain to look up'
        required: false
        default: ''
  push:
    paths:
      - 'data/.debug-hubspot-trigger'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inspect HubSpot
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          DISPATCH_NAME: ${{ github.event.inputs.name }}
          DISPATCH_DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          if [ -n "${DISPATCH_NAME}" ]; then
            export HS_QUERY_NAME="${DISPATCH_NAME}"
            export HS_QUERY_DOMAIN="${DISPATCH_DOMAIN}"
          else
            export HS_QUERY_NAME="$(sed -n '1p' data/.debug-hubspot-trigger | tr -d '[:space:]')"
            export HS_QUERY_DOMAIN="$(sed -n '2p' data/.debug-hubspot-trigger | tr -d '[:space:]')"
          fi
          echo "Name query:   ${HS_QUERY_NAME}"
          echo "Domain query: ${HS_QUERY_DOMAIN}"
          python scripts/debug_hubspot_company.py
