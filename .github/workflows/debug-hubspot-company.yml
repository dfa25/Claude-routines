name: Debug — HubSpot company lookup

# Manual dispatch: provide a company-name search term (CONTAINS_TOKEN) and an
# optional exact email domain. Reads HubSpot via the existing
# HUBSPOT_ACCESS_TOKEN secret; results in the job logs.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Company name to search (CONTAINS_TOKEN)'
        required: true
        default: 'zenith'
      domain:
        description: 'Optional: exact email domain to look up'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Inspect HubSpot
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          DISPATCH_NAME: ${{ github.event.inputs.name }}
          DISPATCH_DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          export HS_QUERY_NAME="${DISPATCH_NAME}"
          export HS_QUERY_DOMAIN="${DISPATCH_DOMAIN}"
          echo "Name query:   ${HS_QUERY_NAME}"
          echo "Domain query: ${HS_QUERY_DOMAIN}"
          python scripts/debug_hubspot_company.py
